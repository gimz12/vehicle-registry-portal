# Five-organisation lab network: six CAs, three Raft orderers, one peer per
# organisation. Copied to $TN/five-org/ by up.sh, so relative paths resolve
# against the fabric-samples test-network directory (space-free). Every port is
# published on 127.0.0.1 only: the CAs still use the samples' bootstrap admin password.
name: fiveorg

networks:
  test:
    name: fabric_test

volumes:
  orderer.example.com:
  orderer2.example.com:
  orderer3.example.com:
  peer0.org1.example.com:
  peer0.org2.example.com:
  peer0.org3.example.com:
  peer0.org4.example.com:
  peer0.org5.example.com:

services:
  ca_org1:
    container_name: ca_org1
    image: hyperledger/fabric-ca:1.5.17
    labels: {service: hyperledger-fabric}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports: ["127.0.0.1:7054:7054", "127.0.0.1:17054:17054"]
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
    networks: [test]
  ca_org2:
    container_name: ca_org2
    image: hyperledger/fabric-ca:1.5.17
    labels: {service: hyperledger-fabric}
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports: ["127.0.0.1:8054:8054", "127.0.0.1:18054:18054"]
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/org2:/etc/hyperledger/fabric-ca-server
    networks: [test]
  ca_org3:
    container_name: ca_org3
    image: hyperledger/fabric-ca:1.5.17
    labels: {service: hyperledger-fabric}
